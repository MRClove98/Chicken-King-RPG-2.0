<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Chicken King RPG V4 Shop Update</title>
<style>
body{margin:0;background:#111}
canvas{display:block;margin:auto;background:#3b7a3b;border:3px solid white}
</style>
</head>
<body>
<canvas id="game" width="1000" height="600"></canvas>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
const keys={};
const player={x:120,y:120,hp:100,maxHp:100,coins:0,dmg:10,potions:2,xp:0,lvl:1};
const shop={x:900,y:80};
let msg="WASD Move | SPACE Attack | E Shop";

document.addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key.toLowerCase()==='e' && Math.hypot(player.x-shop.x,player.y-shop.y)<80){
   msg="Shop Opened!";
 }
});
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function update(){
 if(keys.w) player.y-=3;
 if(keys.s) player.y+=3;
 if(keys.a) player.x-=3;
 if(keys.d) player.x+=3;
}

function drawChicken(x,y){
 let walk=Math.sin(Date.now()/120)*2;
 ctx.fillStyle="#FFD93D";
 ctx.fillRect(x+4,y+8,20,16);
 ctx.fillRect(x+16,y+2,12,12);
 ctx.fillStyle="orange";
 ctx.fillRect(x+28,y+6,6,4);
 ctx.fillStyle="red";
 ctx.fillRect(x+22,y-4,3,6);
 ctx.fillStyle="black";
 ctx.fillRect(x+23,y+5,2,2);
 ctx.fillStyle="orange";
 ctx.fillRect(x+8,y+24+walk,2,6);
 ctx.fillRect(x+18,y+24-walk,2,6);
}

function draw(){
 ctx.fillStyle="#3b7a3b";
 ctx.fillRect(0,0,1000,600);

 drawChicken(player.x,player.y);

 // shop
 ctx.fillStyle="brown";
 ctx.fillRect(shop.x-20,shop.y-20,40,40);

 ctx.fillStyle="white";
 ctx.font="16px Arial";
 ctx.fillText("SHOP", shop.x-24, shop.y-30);

 if(Math.hypot(player.x-shop.x,player.y-shop.y)<80){
   ctx.fillStyle="yellow";
   ctx.fillText("Press E", shop.x-28, shop.y-48);
 }

 ctx.fillStyle="white";
 ctx.fillText(msg,20,30);
}

function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
